openapi: 3.1.0
info:
  title: Billy AP Manager
  version: 1.0.0
  description: Accounts Payable manager API

servers:
  - url: http://localhost:3000/api
    description: Local dev

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Bill:
      type: object
      properties:
        id:
          type: string
          format: uuid
        vendorId:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        number:
          type: string
        amount:
          type: string
          description: Numeric stored as string (numeric 12,2)
        currency:
          type: string
          enum: [USD, EUR, ARS]
        status:
          type: string
          enum: [draft, awaiting_approval, approved, rejected, archived]
        invoiceDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        description:
          type: string
          nullable: true
        paymentType:
          type: string
          enum: [ach, wire, check, card]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateBillBody:
      type: object
      required:
        - vendorId
        - number
        - amount
        - invoiceDate
        - dueDate
        - paymentType
      properties:
        vendorId:
          type: string
          format: uuid
          example: "42a49c88-1a53-41ac-a6b1-69b12f31a53f"
        number:
          type: string
          example: INV-001
        amount:
          type: number
          minimum: 0.01
          example: 1500.00
        currency:
          type: string
          enum: [USD, EUR, ARS]
          default: USD
        invoiceDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "2026-05-21"
        dueDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "2026-05-28"
        description:
          type: string
          example: Office supplies Q2
        paymentType:
          type: string
          enum: [ach, wire, check, card]
          example: ach
        lineItems:
          type: array
          items:
            type: object
            required:
              - description
              - amount
            properties:
              description:
                type: string
                example: Printer paper
              amount:
                type: number
                minimum: 0.01
                example: 250.00
              accountCode:
                type: string
                example: "6100"

    BillLineItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        billId:
          type: string
          format: uuid
        description:
          type: string
        amount:
          type: string
          description: Numeric stored as string (numeric 12,2)
        accountCode:
          type: string
          nullable: true

    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        billId:
          type: string
          format: uuid
        vendorId:
          type: string
          format: uuid
        amount:
          type: string
          description: Numeric stored as string (numeric 12,2)
        status:
          type: string
          enum: [scheduled, initiated, paid, failed]
        scheduledDate:
          type: string
          format: date
        paymentMethod:
          type: string
          enum: [ach, wire, check, card]
        notes:
          type: string
          nullable: true
        initiatedAt:
          type: string
          format: date-time
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BillWithRelations:
      allOf:
        - $ref: "#/components/schemas/Bill"
        - type: object
          properties:
            vendor:
              $ref: "#/components/schemas/Vendor"
              nullable: true
            lineItems:
              type: array
              items:
                $ref: "#/components/schemas/BillLineItem"
            payment:
              $ref: "#/components/schemas/Payment"
              nullable: true

    Vendor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          nullable: true
        ownerId:
          type: string
          format: uuid
          nullable: true
          description: null for global vendors (read-only), user UUID for private vendors
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    VendorWithMethods:
      allOf:
        - $ref: "#/components/schemas/Vendor"
        - type: object
          properties:
            paymentMethods:
              type: array
              items:
                type: string
                enum: [ach, wire, check, card]

    CreateVendorBody:
      type: object
      required:
        - name
        - email
        - paymentMethods
      properties:
        name:
          type: string
          example: Acme Corp
        email:
          type: string
          format: email
          example: billing@acme.com
        paymentMethods:
          type: array
          minItems: 1
          items:
            type: string
            enum: [ach, wire, check, card]
          example: [ach, wire]

    UpdateVendorBody:
      type: object
      properties:
        name:
          type: string
          example: New Name
        email:
          type: string
          format: email
          example: new@email.com
        paymentMethods:
          type: array
          minItems: 1
          items:
            type: string
            enum: [ach, wire, check, card]
          example: [wire]

    AgingRow:
      type: object
      properties:
        vendorId:
          type: string
          format: uuid
        vendorName:
          type: string
        current:
          type: number
          description: Amount not yet overdue
        days1_30:
          type: number
          description: Amount 1–30 days past due
        days31_60:
          type: number
          description: Amount 31–60 days past due
        days61_90:
          type: number
          description: Amount 61–90 days past due
        days90plus:
          type: number
          description: Amount more than 90 days past due
        total:
          type: number
          description: Total outstanding for this vendor

    AgingSummary:
      type: object
      properties:
        totalOutstanding:
          type: number
          description: Sum of all open bill amounts
        totalOverdue:
          type: number
          description: Sum of all overdue bill amounts (excludes current bucket)
        overdueBillCount:
          type: integer
          description: Number of individual bills past their due date

    ImportBillRow:
      type: object
      required:
        - vendor_name
        - number
        - amount
        - invoice_date
        - due_date
        - payment_type
      properties:
        vendor_name:
          type: string
          maxLength: 255
          example: Acme Corp
        number:
          type: string
          maxLength: 100
          example: INV-001
        amount:
          type: number
          minimum: 0.01
          maximum: 99999999.99
          example: 1500.00
        currency:
          type: string
          enum: [USD, EUR, ARS]
          default: USD
        invoice_date:
          type: string
          format: date
          example: "2026-05-21"
        due_date:
          type: string
          format: date
          description: Must be on or after invoice_date
          example: "2026-05-28"
        description:
          type: string
          maxLength: 5000
          example: Office supplies Q2
        payment_type:
          type: string
          enum: [ach, wire, check, card]
          example: ach

    ImportResult:
      type: object
      properties:
        imported:
          type: integer
          description: Number of bills successfully created
          example: 4
        errors:
          type: array
          description: Per-row errors for rows that failed
          items:
            type: object
            properties:
              row:
                type: integer
                description: CSV row number (header = 1, first data row = 2)
                example: 3
              error:
                type: string
                example: 'Bill number "INV-001" already exists'

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

security:
  - BearerAuth: []

paths:
  /bills:
    get:
      summary: List bills for the authenticated user
      operationId: getBills
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, awaiting_approval, approved, rejected, archived]
          description: Filter by bill status
        - name: vendorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by vendor ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bill"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      summary: Create a new bill
      operationId: createBill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillBody"
            examples:
              valid:
                summary: Valid bill with line items
                value:
                  vendorId: "42a49c88-1a53-41ac-a6b1-69b12f31a53f"
                  number: INV-001
                  amount: 1500.00
                  currency: USD
                  invoiceDate: "2026-05-21"
                  dueDate: "2026-05-28"
                  paymentType: ach
                  description: Office supplies Q2
                  lineItems:
                    - description: Printer paper
                      amount: 250.00
                      accountCode: "6100"
                    - description: Toner cartridges
                      amount: 1250.00
              invalid_date:
                summary: Bad date format → 422
                value:
                  vendorId: "42a49c88-1a53-41ac-a6b1-69b12f31a53f"
                  number: INV-002
                  amount: 100
                  invoiceDate: "not-a-date"
                  dueDate: "2026-05-28"
                  paymentType: ach
              invalid_vendor:
                summary: Non-existent vendor → 422
                value:
                  vendorId: "42a49c88-1a53-41ac-a6b1-69b12f31a53f" # Assuming this vendor ID does not exist in the system
                  number: INV-003
                  amount: 100
                  invoiceDate: "2026-05-21"
                  dueDate: "2026-05-28"
                  paymentType: ach
              duplicate_number:
                summary: Duplicate bill number → 409
                value:
                  vendorId: "00000000-0000-0000-0000-000000000000"
                  number: INV-001
                  amount: 100
                  invoiceDate: "2026-05-21"
                  dueDate: "2026-05-28"
                  paymentType: ach
      responses:
        "201":
          description: Bill created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Bill"
        "400":
          description: Malformed JSON body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Invalid JSON body
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Bill number already exists for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Bill number already exists
        "422":
          description: Validation error or vendor not found
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - type: object
                    properties:
                      error:
                        type: array
                        items:
                          type: object
              examples:
                vendor_not_found:
                  summary: Vendor not found
                  value:
                    error: Vendor not found
                validation_error:
                  summary: Zod validation issues
                  value:
                    error:
                      - code: invalid_string
                        path: [invoiceDate]
                        message: Invalid date format (YYYY-MM-DD)
        "500":
          description: Internal server error

  /bills/{id}:
    get:
      summary: Get a single bill with vendor, line items, and payment
      operationId: getBillById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "42a49c88-1a53-41ac-a6b1-69b12f31a53f"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BillWithRelations"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Unauthorized
        "404":
          description: Bill not found or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Bill not found
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bills/{id}/patch:
    patch:
      summary: Submit, approve, reject, or archive a bill
      operationId: patchBill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "42a49c88-1a53-41ac-a6b1-69b12f31a53f"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [submit, approve, reject, archive]
                  description: >
                    `submit` — transitions a draft bill to awaiting_approval.
                    `approve` — transitions an awaiting_approval bill to approved (atomically creates a scheduled payment).
                    `reject` — transitions an awaiting_approval bill to rejected.
                    `archive` — transitions a rejected bill to archived (removes it from the active queue).
            examples:
              submit:
                summary: Submit a draft bill for approval
                value:
                  action: submit
              approve:
                summary: Approve a bill
                value:
                  action: approve
              reject:
                summary: Reject a bill
                value:
                  action: reject
              archive:
                summary: Archive a rejected bill
                value:
                  action: archive
      responses:
        "200":
          description: Bill updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BillWithRelations"
        "400":
          description: Bill is not in the required status for this action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                not_draft:
                  summary: Submit on non-draft bill
                  value:
                    error: Only draft bills can be submitted
                wrong_status:
                  summary: Approve/reject on non-awaiting_approval bill
                  value:
                    error: Bill cannot be approved in current status
                not_rejected:
                  summary: Archive on non-rejected bill
                  value:
                    error: Only rejected bills can be archived
                malformed_json:
                  summary: Malformed JSON body
                  value:
                    error: Invalid request body
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Bill not found or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Bill not found
        "409":
          description: Concurrent update conflict (bill status changed between check and update)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Bill status changed concurrently
        "422":
          description: Invalid action value (Zod validation failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Invalid enum value
        "500":
          description: Internal server error

  /bills/import/create:
    post:
      summary: Bulk-create bills from a pre-validated CSV payload
      operationId: importBills
      description: >
        Accepts up to 50 pre-validated rows. Each row is processed independently —
        if one fails, the rest continue. Vendors are matched case-insensitively and
        auto-created if not found. Global vendors are read-only; private vendors get
        new payment methods added if missing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: "#/components/schemas/ImportBillRow"
            examples:
              valid:
                summary: Two valid rows
                value:
                  rows:
                    - vendor_name: Acme Corp
                      number: INV-001
                      amount: 1500.00
                      currency: USD
                      invoice_date: "2026-05-21"
                      due_date: "2026-05-28"
                      payment_type: ach
                    - vendor_name: Globex
                      number: INV-002
                      amount: 800.00
                      invoice_date: "2026-05-15"
                      due_date: "2026-06-15"
                      payment_type: wire
              partial_failure:
                summary: Second row has a duplicate bill number → partial success
                value:
                  rows:
                    - vendor_name: Acme Corp
                      number: INV-NEW
                      amount: 500.00
                      invoice_date: "2026-05-21"
                      due_date: "2026-05-28"
                      payment_type: ach
                    - vendor_name: Globex
                      number: INV-001
                      amount: 200.00
                      invoice_date: "2026-05-01"
                      due_date: "2026-05-15"
                      payment_type: wire
      responses:
        "201":
          description: Import complete (partial success is still 201)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ImportResult"
              examples:
                all_success:
                  summary: All rows imported
                  value:
                    data:
                      imported: 2
                      errors: []
                partial:
                  summary: One row failed
                  value:
                    data:
                      imported: 1
                      errors:
                        - row: 3
                          error: 'Bill number "INV-001" already exists'
        "400":
          description: Malformed JSON body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Invalid JSON body
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error (rows array empty, exceeds 50, or schema mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Too many rows — max 50 per import
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vendors:
    get:
      summary: List accessible vendors (global + own), ordered by name
      operationId: getVendors
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/VendorWithMethods"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error

    post:
      summary: Create a private vendor
      operationId: createVendor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVendorBody"
            example:
              name: Acme Corp
              email: billing@acme.com
              paymentMethods: [ach, wire]
      responses:
        "201":
          description: Vendor created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/VendorWithMethods"
        "400":
          description: Malformed JSON body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Invalid JSON body
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Vendor name already exists for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Vendor name already exists
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error

  /vendors/{id}:
    patch:
      summary: Update a private vendor
      operationId: updateVendor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVendorBody"
      responses:
        "200":
          description: Vendor updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/VendorWithMethods"
        "400":
          description: Malformed JSON body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Invalid JSON body
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cannot edit a global vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Cannot edit a global vendor
        "404":
          description: Vendor not found or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Vendor not found
        "422":
          description: Validation error or invalid UUID param
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_id:
                  summary: Non-UUID id param
                  value:
                    error: Invalid vendor id
                empty_body:
                  summary: Empty update body
                  value:
                    error: At least one field required
        "500":
          description: Internal server error

  /payments:
    get:
      summary: List payments for the authenticated user
      operationId: getPayments
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [scheduled, initiated, paid, failed]
          description: Filter by payment status
        - name: paymentMethod
          in: query
          required: false
          schema:
            type: string
            enum: [ach, wire, check, card]
          description: Filter by payment method
        - name: vendorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by vendor ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Payment"
                        - type: object
                          properties:
                            bill:
                              $ref: "#/components/schemas/Bill"
                            vendor:
                              $ref: "#/components/schemas/Vendor"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Unauthorized
        "422":
          description: Invalid filter value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_status:
                  summary: Invalid status value
                  value:
                    error: Invalid status value
                invalid_method:
                  summary: Invalid paymentMethod value
                  value:
                    error: Invalid paymentMethod value
                invalid_vendor_id:
                  summary: Non-UUID vendorId
                  value:
                    error: Invalid vendorId
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/{id}:
    patch:
      summary: Transition a payment's status
      operationId: patchPayment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Payment ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [release, mark_paid, retry]
            examples:
              release:
                summary: Release a scheduled payment
                value:
                  action: release
              mark_paid:
                summary: Mark an initiated payment as paid
                value:
                  action: mark_paid
              retry:
                summary: Retry a failed payment
                value:
                  action: retry
      responses:
        "200":
          description: Payment updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Payment"
                      - type: object
                        properties:
                          bill:
                            $ref: "#/components/schemas/Bill"
                          vendor:
                            $ref: "#/components/schemas/Vendor"
        "400":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                not_scheduled:
                  summary: Payment is not in required status
                  value:
                    error: Only scheduled payments can be released
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Concurrent status change (race condition)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Payment status changed concurrently
        "422":
          description: Invalid action value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/aging:
    get:
      summary: AP Aging Report — open bills bucketed by days past due, grouped by vendor
      operationId: getAgingReport
      parameters:
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Cut-off date (YYYY-MM-DD). Only bills with dueDate ≤ endDate are included and aging is calculated relative to this date. Defaults to today.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      rows:
                        type: array
                        items:
                          $ref: "#/components/schemas/AgingRow"
                        description: One row per vendor with open bills, sorted by vendor name
                      summary:
                        $ref: "#/components/schemas/AgingSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/demo:
    post:
      summary: Start a demo session
      operationId: startDemoSession
      description: Sets an httpOnly cookie `demo-session=true` valid for 8 hours. Requires `DEMO_CLERK_ID` env var to be configured on the server.
      responses:
        "204":
          description: Demo session started — no body
        "503":
          description: Demo not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Demo not configured

  /auth/demo/logout:
    post:
      summary: End the demo session
      operationId: endDemoSession
      description: Deletes the `demo-session` cookie server-side.
      responses:
        "204":
          description: Demo session ended — no body

  /auth/me:
    get:
      summary: Get current user
      operationId: getMe
      description: Returns the authenticated user's name, email, and whether the session is a demo session. Works for both Clerk and demo sessions.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [name, email, isDemo]
                    properties:
                      name:
                        type: string
                        example: Juan Aguirre
                      email:
                        type: string
                        format: email
                        example: juan@example.com
                      isDemo:
                        type: boolean
                        example: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
